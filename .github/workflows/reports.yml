name: Backfill and publish league reports
on:
  schedule:
    # Wednesday 10:00 UTC, after the Monday-night game and ESPN's week rollover.
    - cron: '0 10 * * 3'
  workflow_dispatch:
    inputs:
      config:
        description: Repository path to the JSON list of league runs
        required: true
        default: report_runs.json
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: league-report-publishing
  cancel-in-progress: false
jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            yahoo-fantasy-data/pyproject.toml
            report_code/requirements.txt
      - run: python -m pip install './yahoo-fantasy-data[dev]' -r report_code/requirements.txt
      - run: python -m pytest report_code/tests yahoo-fantasy-data/tests -m 'not integration' -q
      - name: Collect archives and build site
        env:
          RUN_CONFIG: ${{ inputs.config || 'report_runs.json' }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
          YAHOO_CLIENT_ID: ${{ secrets.YAHOO_CLIENT_ID }}
          YAHOO_CLIENT_SECRET: ${{ secrets.YAHOO_CLIENT_SECRET }}
          YAHOO_REFRESH_TOKEN: ${{ secrets.YAHOO_REFRESH_TOKEN }}
        shell: bash
        run: python -m report_code.publish --config "$RUN_CONFIG" --backfill
      - name: Commit generated archives and docs to main
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs yahoo-fantasy-data/data
          if ! git diff --cached --quiet; then
            git commit -m 'Update league archives, reports and silver downloads'
            git push origin HEAD:main
          fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
