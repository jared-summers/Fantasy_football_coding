name: Check ESPN data
on:
  workflow_dispatch:
    inputs:
      league_id:
        description: ESPN league ID (the number after leagueId= in your league URL)
        required: true
      year:
        description: Season
        required: true
        default: '2026'
      week:
        description: A completed week to check
        required: true
        default: '6'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ./yahoo-fantasy-data -r report_code/requirements.txt
      - name: Print what ESPN returns
        env:
          LEAGUE_ID: ${{ inputs.league_id }}
          YEAR: ${{ inputs.year }}
          WEEK: ${{ inputs.week }}
          ESPN_S2: ${{ secrets.ESPN_S2 }}
          ESPN_SWID: ${{ secrets.ESPN_SWID }}
        run: python -m report_code.espn "$LEAGUE_ID" "$YEAR" "$WEEK"
